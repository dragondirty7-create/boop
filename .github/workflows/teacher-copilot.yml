name: Teacher Copilot checks
on:
  pull_request:
    paths: ['teacher-copilot/**', 'tests/teacher-copilot.test.js', 'scripts/check-teacher-copilot.js', 'package.json', '.github/workflows/teacher-copilot.yml']
  push:
    paths: ['teacher-copilot/**', 'tests/teacher-copilot.test.js', 'scripts/check-teacher-copilot.js', 'package.json', '.github/workflows/teacher-copilot.yml']
permissions:
  contents: read
jobs:
  teacher-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run test:teacher
      - run: npm run check:teacher
